x-nextin:
  version: 1
  mode: template

proxies: []

proxy-groups:
  # =================自动测速组=================
  - name: "🇭🇰 香港自动选择"
    type: url-test
    include-all-proxies: true
    filter: "(?i)(港|HK|hk|Hong Kong|HongKong|hongkong)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇯🇵 日本自动选择"
    type: url-test
    include-all-proxies: true
    filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇺🇲 美国自动选择"
    type: url-test
    include-all-proxies: true
    filter: "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇸🇬 新加坡自动选择"
    type: url-test
    include-all-proxies: true
    filter: "(?i)(新加坡|坡|狮城|SG|Singapore)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇨🇳 台湾自动选择"
    type: url-test
    include-all-proxies: true
    filter: "(?i)(台|新北|彰化|TW|Taiwan)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # =================基础策略组=================
  - name: "Default"
    type: select
    proxies:
      - "🇯🇵 日本自动选择"
      - "🇭🇰 香港自动选择"
      - "🇸🇬 新加坡自动选择"
      - "🇨🇳 台湾自动选择"
      - "🇺🇲 美国自动选择"
    include-all-proxies: true

  - name: "Final"
    type: select
    proxies:
      - "Default"
      - "DIRECT"
    include-all-proxies: true

  # =================应用策略组=================
  - name: "Telegram"
    type: select
    proxies: ["Default", "DIRECT"]
    include-all-proxies: true

  - name: "ChatGPT"
    type: select
    proxies: ["Default", "DIRECT"]
    include-all-proxies: true

  - name: "Claude"
    type: select
    proxies: ["Default", "DIRECT"]
    include-all-proxies: true

